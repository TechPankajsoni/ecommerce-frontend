<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Eligibility Test Suite</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-suite { max-width: 800px; margin: 0 auto; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 3px; }
        .pass { background-color: #d4edda; color: #155724; }
        .fail { background-color: #f8d7da; color: #721c24; }
        .test-controls { margin: 20px 0; }
        button { margin: 5px; padding: 10px 15px; cursor: pointer; }
        .debug-info { background-color: #f8f9fa; padding: 10px; margin: 10px 0; font-family: monospace; }
    </style>
</head>
<body>
    <div class="test-suite">
        <h1>🛒 Cart Eligibility Test Suite</h1>
        
        <div class="test-controls">
            <button onclick="runAllTests()">Run All Tests</button>
            <button onclick="clearLocalStorage()">Clear Local Storage</button>
            <button onclick="populateTestData()">Populate Test Data</button>
            <button onclick="checkResponsive()">Check Responsive</button>
        </div>

        <div id="test-results"></div>

        <div class="debug-info">
            <h3>Debug Information</h3>
            <div id="debug-output"></div>
        </div>
    </div>

    <script>
        // Test Suite Implementation
        class CartEligibilityTester {
            constructor() {
                this.testResults = [];
                this.testData = [
                    {
                        cartItemId: 'test-1',
                        name: 'Test Product 1',
                        price: 29.99,
                        quantity: 2,
                        image: '../assets/IMAGE/blue.webp',
                        selectedSize: 'M',
                        selectedColor: 'Blue'
                    },
                    {
                        cartItemId: 'test-2',
                        name: 'Test Product 2',
                        price: 49.99,
                        quantity: 1,
                        image: '../assets/IMAGE/red color.webp',
                        selectedSize: 'L',
                        selectedColor: 'Red'
                    }
                ];
            }

            // Test 1: Local Storage Loading
            testLocalStorageLoad() {
                console.log('🧪 Testing: Local Storage Loading');
                
                // Clear and populate test data
                localStorage.setItem('cartItems', JSON.stringify(this.testData));
                
                // Test loading
                const loadedCart = JSON.parse(localStorage.getItem('cartItems') || '[]');
                const passed = loadedCart.length === 2 && 
                              loadedCart[0].name === 'Test Product 1';
                
                return {
                    test: 'Local Storage Load',
                    passed,
                    details: `Loaded ${loadedCart.length} items, first item: ${loadedCart[0]?.name || 'none'}`
                };
            }

            // Test 2: Quantity Updates & Price Calculations
            testQuantityUpdates() {
                console.log('🧪 Testing: Quantity Updates & Price Calculations');
                
                const item = this.testData[0];
                const originalQuantity = item.quantity;
                const newQuantity = originalQuantity + 1;
                const expectedTotal = item.price * newQuantity;
                
                // Simulate quantity update
                item.quantity = newQuantity;
                const actualTotal = item.price * item.quantity;
                
                const passed = actualTotal === expectedTotal;
                
                // Reset
                item.quantity = originalQuantity;
                
                return {
                    test: 'Quantity Updates & Price Calculations',
                    passed,
                    details: `Expected total: $${expectedTotal.toFixed(2)}, Actual: $${actualTotal.toFixed(2)}`
                };
            }

            // Test 3: Remove Button Functionality
            testRemoveButton() {
                console.log('🧪 Testing: Remove Button Functionality');
                
                const initialCount = this.testData.length;
                const itemToRemove = this.testData[0];
                
                // Simulate removal
                const filteredCart = this.testData.filter(item => item.cartItemId !== itemToRemove.cartItemId);
                const passed = filteredCart.length === initialCount - 1;
                
                return {
                    test: 'Remove Button Functionality',
                    passed,
                    details: `Removed 1 item, ${filteredCart.length} items remaining`
                };
            }

            // Test 4: Checkout Button Functionality
            testCheckoutButton() {
                console.log('🧪 Testing: Checkout Button Functionality');
                
                // Test with items
                const hasItems = this.testData.length > 0;
                
                // Test navigation (simulated)
                const navigationTest = hasItems ? 'checkout.html' : 'disabled';
                
                return {
                    test: 'Checkout Button Functionality',
                    passed: true, // Simulated
                    details: hasItems ? 'Navigation to checkout.html enabled' : 'Button disabled (empty cart)'
                };
            }

            // Test 5: Responsive Layout
            testResponsiveLayout() {
                console.log('🧪 Testing: Responsive Layout');
                
                // Simulate responsive checks
                const viewports = [
                    { name: 'Mobile', width: 375 },
                    { name: 'Tablet', width: 768 },
                    { name: 'Desktop', width: 1024 }
                ];
                
                const results = viewports.map(vp => ({
                    viewport: vp.name,
                    width: vp.width,
                    status: 'Tested'
                }));
                
                return {
                    test: 'Responsive Layout',
                    passed: true,
                    details: `Tested on ${viewports.length} viewport sizes`
                };
            }

            // Test 6: Cart Item Rendering
            testCartItemRendering() {
                console.log('🧪 Testing: Cart Item Rendering');
                
                const item = this.testData[0];
                const requiredFields = ['cartItemId', 'name', 'price', 'quantity', 'image'];
                const hasAllFields = requiredFields.every(field => item[field] !== undefined);
                
                return {
                    test: 'Cart Item Rendering',
                    passed: hasAllFields,
                    details: `All required fields present: ${requiredFields.join(', ')}`
                };
            }

            // Test 7: Cart Summary Updates
            testCartSummaryUpdates() {
                console.log('🧪 Testing: Cart Summary Updates');
                
                const subtotal = this.testData.reduce((sum, item) => 
                    sum + (item.price * item.quantity), 0);
                const shipping = 5.00;
                const total = subtotal + shipping;
                
                const expectedSubtotal = 29.99 * 2 + 49.99 * 1;
                const expectedTotal = expectedSubtotal + 5.00;
                
                const passed = Math.abs(subtotal - expectedSubtotal) < 0.01;
                
                return {
                    test: 'Cart Summary Updates',
                    passed,
                    details: `Subtotal: $${subtotal.toFixed(2)}, Total: $${total.toFixed(2)}`
                };
            }

            // Test 8: Edge Cases & Error Handling
            testEdgeCases() {
                console.log('🧪 Testing: Edge Cases & Error Handling');
                
                // Test empty cart
                const emptyCart = [];
                const emptyCartResult = emptyCart.length === 0;
                
                // Test malformed data
                try {
                    JSON.parse('{"invalid": json}');
                    var malformedResult = false;
                } catch (e) {
                    var malformedResult = true;
                }
                
                return {
                    test: 'Edge Cases & Error Handling',
                    passed: emptyCartResult && malformedResult,
                    details: 'Empty cart handled, malformed JSON caught'
                };
            }

            // Run all tests
            runAllTests() {
                console.clear();
                console.log('🚀 Starting Cart Eligibility Tests...\n');
                
                const tests = [
                    this.testLocalStorageLoad(),
                    this.testQuantityUpdates(),
                    this.testRemoveButton(),
                    this.testCheckoutButton(),
                    this.testResponsiveLayout(),
                    this.testCartItemRendering(),
                    this.testCartSummaryUpdates(),
                    this.testEdgeCases()
                ];
                
                this.displayResults(tests);
                this.displayDebugInfo();
            }

            displayResults(results) {
                const resultsContainer = document.getElementById('test-results');
                resultsContainer.innerHTML = '<h2>Test Results</h2>';
                
                let passedCount = 0;
                
                results.forEach(result => {
                    const div = document.createElement('div');
                    div.className = `test-result ${result.passed ? 'pass' : 'fail'}`;
                    div.innerHTML = `
                        <strong>${result.test}</strong>: ${result.passed ? 'PASSED' : 'FAILED'}<br>
                        <small>${result.details}</small>
                    `;
                    resultsContainer.appendChild(div);
                    
                    if (result.passed) passedCount++;
                });
                
                const summary = document.createElement('div');
                summary.className = 'test-result';
                summary.innerHTML = `<strong>Summary: ${passedCount}/${results.length} tests passed</strong>`;
                resultsContainer.appendChild(summary);
            }

            displayDebugInfo() {
                const debugContainer = document.getElementById('debug-output');
                debugContainer.innerHTML = `
                    <p><strong>Local Storage Status:</strong> ${localStorage.getItem('cartItems') ? 'Has data' : 'Empty'}</p>
                    <p><strong>Test Data Items:</strong> ${this.testData.length}</p>
                    <p><strong>Current Cart Total:</strong> $${this.testData.reduce((sum, item) => sum + (item.price * item.quantity), 0).toFixed(2)}</p>
                `;
            }

            // Utility functions
            clearLocalStorage() {
                localStorage.removeItem('cartItems');
                console.log('Local storage cleared');
            }

            populateTestData() {
                localStorage.setItem('cartItems', JSON.stringify(this.testData));
                console.log('Test data populated');
            }

            checkResponsive() {
                console.log('Responsive check initiated');
                const widths = [375, 768, 1024];
                widths.forEach(width => {
                    console.log(`Testing at ${width}px width`);
                });
            }
        }

        // Global functions
        const tester = new CartEligibilityTester();
        
        function runAllTests() {
            tester.runAllTests();
        }
        
        function clearLocalStorage() {
            tester.clearLocalStorage();
            document.getElementById('test-results').innerHTML = '<p>Local storage cleared. Run tests to verify.</p>';
        }
        
        function populateTestData() {
            tester.populateTestData();
            document.getElementById('test-results').innerHTML = '<p>Test data populated. Run tests to verify.</p>';
        }
        
        function checkResponsive() {
            tester.checkResponsive();
            document.getElementById('test-results').innerHTML = '<p>Responsive check completed. Check console for details.</p>';
        }

        // Auto-run basic tests on load
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Cart Eligibility Test Suite Loaded');
            console.log('Click "Run All Tests" to start comprehensive testing');
        });
    </script>
</body>
</html>
